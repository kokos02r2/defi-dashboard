# Конфиг nginx. Копируется в /etc/nginx/sites-available/dashboard
# ЗАМЕНИТЕ ВАШ-ПОДДОМЕН на своё имя в duckdns.
#
# Здесь только HTTP. Блок для 443 и редирект допишет certbot сам — руками
# сертификаты прописывать не нужно.

server {
    listen 80;
    listen [::]:80;
    server_name ВАШ-ПОДДОМЕН.duckdns.org;

    # дашборд для одного человека: смысла отдавать его поисковикам нет
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # без этого приложение видит IP nginx и считает все попытки входа за одного
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # первичная синхронизация кошелька сканирует логи по всем сетям
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # статику отдаёт сам nginx, до приложения она не доходит
    location /static/ {
        alias /opt/dashboard/app/web/static/;
        expires 7d;
        access_log off;
    }
}
